<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Practice Consti I finals problems in the ALAC format and check yourself against the bar's 0–5 rubric. Drill Crim Pro (Rules 110–127) with one-fact twist MCQs." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ALAC Consti Practice" />
		<meta property="og:title" content="ALAC · Consti I Finals practice" />
		<meta
			property="og:description"
			content="Practice random bar-style problems in the Answer, Legal Basis, Application, Conclusion format and self-check against the 0–5 rubric. Review material is AI-generated; verify before relying on it."
		/>
		<meta property="og:url" content="%site_origin%/" />
		<meta property="og:image" content="%site_origin%/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="ALAC Consti I Finals practice" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
		/>
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				var s = JSON.parse(localStorage.getItem('alac-consti:v1') || '{}');
				var t = s && s.prefs && s.prefs.theme;
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
